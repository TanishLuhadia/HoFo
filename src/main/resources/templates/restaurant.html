<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Restaurants</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body class="bg-gray-100">

<!-- HEADER -->

<div class="bg-orange-500 text-white p-5">

    <div class="max-w-7xl mx-auto flex justify-between">

        <h1 class="text-3xl font-bold">
            HoFo
        </h1>

        <button
            id="logoutBtn"
            class="bg-white text-orange-500 px-4 py-2 rounded">

            Logout

        </button>

    </div>

</div>

<!-- LOCATION SECTION -->

<div class="max-w-7xl mx-auto mt-6">

    <div class="bg-white p-6 rounded shadow">

        <h2 class="text-xl font-bold mb-4">

            Choose Location

        </h2>

        <div class="flex gap-3">

            <button
                id="locationBtn"
                class="bg-orange-500 text-white px-5 py-2 rounded">

                Use My Location

            </button>

            <select
                id="citySelect"
                class="border p-2 rounded">

                <option value="">
                    Select City
                </option>

            </select>

        </div>

    </div>

</div>

<!-- NEARBY -->

<div
    id="nearbySection"
    class="max-w-7xl mx-auto mt-8 hidden">

    <h2 class="text-2xl font-bold mb-4">

        Nearby Restaurants

    </h2>

    <div
        id="nearbyRestaurants"
        class="grid md:grid-cols-3 gap-6">

    </div>

</div>

<!-- CITY -->

<div
    id="citySection"
    class="max-w-7xl mx-auto mt-8 hidden">

    <h2 class="text-2xl font-bold mb-4">

        Restaurants In City

    </h2>

    <div
        id="cityRestaurants"
        class="grid md:grid-cols-3 gap-6">

    </div>

</div>

<script>

$(document).ready(function(){

    loadCities();

});

function loadCities(){

    $.ajax({

        url:"/api/cities",

        headers:{
            Authorization:
            "Bearer " + localStorage.getItem("token")
        },

        success:function(cities){

            cities.forEach(city=>{

                $("#citySelect").append(

                    `<option value="${city}">
                        ${city}
                    </option>`
                );

            });

        },

        error:function(){

            sessionExpired();

        }

    });

}

$("#locationBtn").click(function(){

    navigator.geolocation.getCurrentPosition(

        function(position){

            loadNearbyRestaurants(

                position.coords.latitude,
                position.coords.longitude

            );

        },

        function(){

            alert(
                "Location denied. Please select city."
            );

        }

    );

});

$("#citySelect").change(function(){

    let city = $(this).val();

    if(city==="") return;

    $.ajax({

        url:"/api/restaurants/city",

        data:{
            city:city
        },

        headers:{
            Authorization:
            "Bearer " + localStorage.getItem("token")
        },

        success:function(restaurants){

            $("#citySection").removeClass("hidden");

            $("#cityRestaurants").html("");

            restaurants.forEach(r=>{

                $("#cityRestaurants").append(

                    restaurantCard(r)

                );

            });

        },

        error:function(){

            sessionExpired();

        }

    });

});

function loadNearbyRestaurants(lat,lng){

    $.ajax({

        url:"/api/restaurants/nearby",

        data:{
            latitude:lat,
            longitude:lng
        },

        headers:{
            Authorization:
            "Bearer " + localStorage.getItem("token")
        },

        success:function(restaurants){

            $("#nearbySection")
                .removeClass("hidden");

            $("#nearbyRestaurants")
                .html("");

            restaurants.forEach(r=>{

                $("#nearbyRestaurants")
                    .append(
                        restaurantCard(r)
                    );

            });

        },

        error:function(){

            sessionExpired();

        }

    });

}

function restaurantCard(r){

    return `

        <div
            class="bg-white rounded shadow overflow-hidden">

            <img
                src="${r.imageUrl}"
                class="h-52 w-full object-cover">

            <div class="p-4">

                <h3
                    class="text-xl font-bold">

                    ${r.name}

                </h3>

                <p
                    class="text-gray-600 mt-2">

                    ${r.description}

                </p>

                <p
                    class="mt-2 text-sm">

                    ${r.address}

                </p>

                ${
                    r.distance
                    ?
                    `<p class="text-orange-500 font-bold mt-2">
                        ${r.distance.toFixed(1)} km away
                     </p>`
                    :
                    ''
                }

                <button
                    class="mt-4 w-full bg-orange-500 text-white py-2 rounded">

                    View Restaurant

                </button>

            </div>

        </div>

    `;
}

$("#logoutBtn").click(function(){

    localStorage.removeItem("token");

    window.location.href =
        "/login";

});

function sessionExpired(){

    localStorage.removeItem("token");

    alert(
        "Your session has expired. Please login again."
    );

    window.location.href =
        "/loginP";

}

</script>

</body>
</html>
