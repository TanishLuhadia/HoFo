	<!DOCTYPE html>
	<html lang="en">
	
	<head>
	
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>HoFo - Login</title>
	
	<script src="https://cdn.tailwindcss.com"></script>
	
	<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
	<script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
	
	<style>
	
	body{
	    min-height:100vh;
	    background:
	    radial-gradient(circle at top left,
	    rgba(249,115,22,.15),
	    transparent 40%),
	
	    radial-gradient(circle at bottom right,
	    rgba(249,115,22,.12),
	    transparent 40%),
	
	    #030303;
	}
	
	.glass{
	    backdrop-filter: blur(20px);
	    background: rgba(255,255,255,.04);
	    border: 1px solid rgba(255,255,255,.08);
	}
	
	label.error{
	    color:#ef4444;
	    font-size:13px;
	    margin-top:5px;
	    display:block;
	}
	
	#invalidSpan,
	#invalidUsername,
	#invalidPassword{
	    color:#ef4444;
	    font-size:13px;
	}
	
	</style>
	
	<script>
	
	$(document).ready(() => {
	
	    $("#form1").validate({
	
	        rules: {
	            username: {
	                required: true
	            },
	            password: {
	                required: true
	            }
	        },
	
	        messages: {
	            username: {
	                required: "Please enter username"
	            },
	            password: {
	                required: "Please enter password"
	            }
	        },
	
	        submitHandler: function(form) {
	
	            $("#button1").prop("disabled", true);
	
	            $("#invalidPassword").text("");
	            $("#invalidUsername").text("");
	            $("#invalidSpan").text("");
	
	            $.ajax({
	
	                url: "/login",
	                type: "POST",
	                contentType: "application/json",
	
	                data: JSON.stringify({
	                    username: $("#username").val(),
	                    password: $("#password").val()
	                }),
	
	                success: function(data) {
	
	                    $("#button1").prop("disabled", false);
	
	                    if(data.successful === true){
							alert(data.result)
							localStorage.setItem("token", data.result);
	
	                        window.location.href = "/restaurant";
	
	                    }else{
	
	                        if(data.exception === "Wrong password"){
	
	                            $("#invalidPassword").text("Wrong Password");
	
	                        }else if(data.exception === "Please verify the account"){
	
	                            $("#invalidSpan").text("Please verify the account");
	
	                        }else{
	
	                            $("#invalidUsername").text("Invalid Username");
	
	                        }
	                    }
	                },
	
	                error: function() {
	
	                    $("#button1").prop("disabled", false);
	
	                    $("#invalidSpan").text("Something went wrong. Please try again.");
	                }
	
	            });
	
	        }
	    });
	
	});
	
	</script>
	
	</head>
	
	<body class="flex items-center justify-center p-6">
	
	<div class="w-full max-w-6xl rounded-3xl overflow-hidden glass shadow-2xl">
	
	    <div class="grid lg:grid-cols-2">
	
	        <!-- LEFT SIDE -->
	
	        <div class="hidden lg:flex flex-col justify-center p-14 bg-gradient-to-br from-orange-500 to-amber-600">
	
	            <div>
	
	                <h1 class="text-6xl font-black text-white mb-6">
	                    HoFo
	                </h1>
	
	                <p class="text-2xl text-orange-100 font-semibold mb-8">
	                    Smart Dining. Zero Waiting.
	                </p>
	
	                <p class="text-orange-50 leading-8 text-lg">
	
	                    Reserve tables before leaving home.
	                    <br><br>
	
	                    Pre-order meals in advance.
	                    <br><br>
	
	                    Track kitchen progress in real-time.
	                    <br><br>
	
	                    Arrive exactly when your food is ready.
	
	                </p>
	
	            </div>
	
	        </div>
	
	        <!-- RIGHT SIDE -->
	
	        <div class="p-8 md:p-14">
	
	            <div class="max-w-md mx-auto">
	
	                <div class="text-center mb-10">
	
	                    <div class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center text-4xl">
	                        🍽️
	                    </div>
	
	                    <h2 class="text-4xl font-bold text-white">
	                        Welcome Back
	                    </h2>
	
	                    <p class="text-gray-400 mt-3">
	                        Sign in to continue to HoFo
	                    </p>
	
	                </div>
	
	                <form id="form1" class="space-y-6">
	
	                    <div>
	
	                        <label class="block text-sm text-gray-300 mb-2">
	                            Username
	                        </label>
	
	                        <input
	                            type="text"
	                            id="username"
	                            name="username"
	                            placeholder="Enter your username"
	                            class="w-full h-14 px-4 rounded-xl bg-neutral-900 border border-neutral-700 text-white focus:outline-none focus:border-orange-500">
	
	                        <span id="invalidUsername"></span>
	
	                    </div>
	
	                    <div>
	
	                        <label class="block text-sm text-gray-300 mb-2">
	                            Password
	                        </label>
	
	                        <input
	                            type="password"
	                            id="password"
	                            name="password"
	                            placeholder="Enter your password"
	                            class="w-full h-14 px-4 rounded-xl bg-neutral-900 border border-neutral-700 text-white focus:outline-none focus:border-orange-500">
	
	                        <span id="invalidPassword"></span>
	
	                    </div>
	
	                    <div class="text-right">
	
	                        <a
	                            href="/forgot-password"
	                            class="text-orange-400 hover:text-orange-300 text-sm">
	
	                            Forgot Password?
	
	                        </a>
	
	                    </div>
	
	                    <span id="invalidSpan"></span>
	
	                    <button
	                        id="button1"
	                        type="submit"
	                        class="w-full h-14 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold transition">
	
	                        Sign In
	
	                    </button>
	
	                </form>
	
	                <div class="mt-10 text-center">
	
	                    <p class="text-gray-400">
	                        New to HoFo?
	                    </p>
	
	                    <a
	                        href="/registerPage"
	                        class="text-orange-400 hover:text-orange-300 font-semibold">
	
	                        Create an Account
	
	                    </a>
	
	                </div>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>
	
	</body>
	
	</html>
